<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="lib/receipt-printer-encoder.umd.js"></script>
    <script src="lib/prng.js"></script>
    <link rel="stylesheet" href="zoltan.css"/>
    <title>Zoltan - Daily Fortuneteller</title>
</head>
<body>
<script defer src="zoltan.js"></script>
    <main id="auth" class="hidden">
        You are not authenticated. Please
<a href="https://receipt.recurse.com/login">log in to the receipt printer API.</a>
    </main>
    <main id="content" class="hidden">
        <form id="form">
            <section class="intro">
                <h1>I can tell your fortune!</h1>
                <img src="zoltan.jpg" alt="Photograph of a 1963 Zoltan fortuneteller arcade machine" />
            </section>
            <p>But with one important restriction! Please, only request one if you have physical access to 397 Bridge Street to retrieve your fortune, or can convince a person there to be your hands.</p>
            <label for="submit">Zoltan, what will the day bring?</label>
            <button id="submit" type="submit">I must know!</button>
        </form>
        <section id="response"></section>
    </main>
    <aside class="hidden">
        <img src="img/AND.png" id="andImage" />
        <img src="img/OR.png" id="orImage" />
        <img src="img/XOR.png" id="xorImage" />
        <img src="img/NAND.png" id="nandImage" />
        <img src="img/NOR.png" id="norImage" />
        <img src="img/XNOR.png" id="xnorImage" />
    </aside>
</body>
</html>
